<script>
const NS = 'http://www.w3.org/2000/svg';
const T_END = 13.8;
const $ = id => document.getElementById(id);
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const seg = (t, a, b, f = ease) => f(clamp((t - a) / (b - a)));
const lerp = (a, b, s) => a + (b - a) * s;
const mix = (c1, c2, s) => { const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); const a = p(c1), b = p(c2); return '#' + a.map((v, i) => Math.round(lerp(v, b[i], s)).toString(16).padStart(2, '0')).join(''); };

/* ---------- 정적 요소 ---------- */
const meta = [['소속', '군산대학교 임베디드소프트웨어학과'], ['팀명', '매니큐'], ['발표자', '이헌규'], ['팀원', '박태민, 채우진, 문찬경'], ['발표일', '2026. 11. 11'], ['지도교수', '이성렬 교수님']];
const metaEls = meta.map(([k, v]) => [
  el('text', { x: 100, y: 892, 'dominant-baseline': 'central', 'font-size': 18, fill: '#2563eb' }, $('meta')),
  el('text', { x: 100, y: 928, 'dominant-baseline': 'central', 'font-size': 24, fill: '#94a3b8' }, $('meta')),
].map((e, i) => (e.textContent = i ? v : k, e)));
// 열 위치는 글꼴이 로드된 뒤 실제 글자 폭으로 정한다 (열 사이 간격 57px)
function layoutMeta() {
  let x = 100;
  for (const pair of metaEls) {
    pair.forEach(e => e.setAttribute('x', x));
    x += Math.max(...pair.map(e => e.getComputedTextLength())) + 57;
  }
}
const TY = 610;                                   // 테이블 윗면
const BIN_X = i => 1222 + i * 66, BIN_W = 62, BIN_TOP = 560;
[['#1f2937', '#111827'], ['#ffffff', '#94a3b8'], ['#38bdf8', '#0ea5e9'], ['#f9a8d4', '#ec4899']].forEach(([f, s], i) => {
  el('rect', { x: BIN_X(i), y: BIN_TOP, width: BIN_W, height: TY - BIN_TOP, rx: 4, fill: f, stroke: s, 'stroke-width': 2 }, $('bins'));
  el('rect', { x: BIN_X(i) + 5, y: BIN_TOP, width: BIN_W - 10, height: 7, rx: 2, fill: '#000', opacity: .13 }, $('bins'));
});
// 나머지 물체 (파란 마커는 움직이는 #marker)
const O = $('objects');
el('rect', { x: 1572, y: TY - 13, width: 56, height: 13, rx: 6.5, fill: '#f1f5f9', stroke: '#cbd5e1' }, O);
el('rect', { x: 1572, y: TY - 13.5, width: 16, height: 14, rx: 6, fill: '#dc2626' }, O);
el('rect', { x: 1640, y: TY - 46, width: 22, height: 46, rx: 4, fill: '#facc15' }, O);
el('rect', { x: 1640, y: TY - 54, width: 22, height: 14, rx: 3, fill: '#7c3aed' }, O);

/* ---------- 로봇 팔 (도형은 기존 Figma 단위, 1.25배) ---------- */
const K = 1.25, L1 = 160 * K, L2 = 150 * K, SH = 70 * K, GRIP = 63;
function buildArm(bx, mirror) {
  const g = el('g', { transform: `translate(${bx},${TY}) scale(${mirror ? -K : K},${K})` }, $('arms'));
  el('rect', { x: -36, y: -44, width: 72, height: 44, rx: 8, fill: 'url(#gBase)' }, g);
  el('rect', { x: -36, y: -44, width: 72, height: 6, rx: 3, fill: '#fff', opacity: .12 }, g);
  el('rect', { x: -24, y: -86, width: 48, height: 50, rx: 12, fill: 'url(#gTurret)' }, g);
  const j1 = el('g', {}, g);
  el('rect', { x: -13, y: -160, width: 26, height: 160, rx: 13, fill: 'url(#gUpper)' }, j1);
  el('rect', { x: -4, y: -140, width: 5, height: 120, rx: 2.5, fill: '#fff', opacity: .18 }, j1);
  const j2 = el('g', {}, j1);
  el('rect', { x: -11, y: -150, width: 22, height: 150, rx: 11, fill: 'url(#gFore)' }, j2);
  el('rect', { x: -3, y: -130, width: 4, height: 110, rx: 2, fill: '#fff', opacity: .2 }, j2);
  const j3 = el('g', {}, j2);
  const grip = el('g', { transform: 'rotate(180)' }, j3);
  el('rect', { x: -13, y: 2, width: 26, height: 26, rx: 6, fill: '#4338ca' }, grip);
  el('rect', { x: 5, y: 22, width: 6, height: 40, rx: 3, fill: '#312e81' }, grip);
  const jaw = el('g', {}, grip);
  el('rect', { x: -3, y: 0, width: 6, height: 38, rx: 3, fill: '#312e81' }, jaw);
  el('circle', { r: 10, fill: '#312e81' }, j3); el('circle', { r: 3.5, fill: '#e0e7ff' }, j3);
  el('circle', { r: 19, fill: '#312e81' }, j2); el('circle', { r: 5.5, fill: '#e0e7ff' }, j2);
  el('circle', { r: 18, fill: '#312e81' }, j1); el('circle', { r: 5.5, fill: '#e0e7ff' }, j1);
  return { bx, mirror, j1, j2, j3, jaw };
}
const LA = buildArm(1170, false), RA = buildArm(1750, true);
const D = Math.PI / 180;
function fk(arm, a1, a2) {           // 관절각 → 손목 위치(화면)
  const s = arm.mirror ? -1 : 1, sy = TY - SH;
  const ex = s * L1 * Math.sin(a1 * D), ey = -L1 * Math.cos(a1 * D);
  return [arm.bx + s * (ex + L2 * Math.sin((a1 + a2) * D)), sy + ey - L2 * Math.cos((a1 + a2) * D)];
}
function ik(arm, wx, wy) {           // 손목 위치 → 관절각 (팔꿈치 위)
  const dx = (arm.mirror ? -1 : 1) * (wx - arm.bx), dy = wy - (TY - SH);
  const d = Math.min(Math.hypot(dx, dy), L1 + L2 - .01);
  const a2 = Math.acos(clamp((d * d - L1 * L1 - L2 * L2) / (2 * L1 * L2), -1, 1)) / D;
  const phi = Math.atan2(dx, -dy) / D;
  const a1 = phi - Math.atan2(L2 * Math.sin(a2 * D), L1 + L2 * Math.cos(a2 * D)) / D;
  return [a1, a2];
}
function pose(arm, w, jawDeg) {
  const [a1, a2] = ik(arm, w[0], w[1]);
  arm.j1.setAttribute('transform', `translate(0,${-70}) rotate(${a1})`);
  arm.j2.setAttribute('transform', `translate(0,-160) rotate(${a2})`);
  arm.j3.setAttribute('transform', `translate(0,-150) rotate(${180 - a1 - a2})`);
  arm.jaw.setAttribute('transform', `translate(-9,24) rotate(${jawDeg})`);
}
const REST = [2.35, 104.66];
const L_REST = fk(LA, ...REST), R_REST = fk(RA, ...REST);

/* ---------- 작업 시나리오: 오른팔 집기 → 건네기 → 왼팔 흰색 칸 ---------- */
const MK0 = [1518, TY - 6.5];                     // 파란 마커 처음 위치(중심)
const OFF = 17;                                   // 두 집게가 마커를 잡는 위치(중심에서 ±)
const HAND = [1440, 440];                         // 건네는 지점(마커 중심)
const PLACE = [BIN_X(1) + BIN_W / 2, 505];        // 흰색 칸 위(마커 중심)
const W = (m, side) => [m[0] + side * OFF, m[1] - GRIP]; // 마커 중심 → 손목
const R_KEYS = [[0, R_REST], [6.3, R_REST], [7.3, [W(MK0, 1)[0], 480]], [7.7, W(MK0, 1)], [8.0, W(MK0, 1)],
                [8.35, [W(MK0, 1)[0], 470]], [9.25, W(HAND, 1)], [10.25, W(HAND, 1)], [11.3, R_REST]];
const L_KEYS = [[0, L_REST], [8.3, L_REST], [9.35, [W(HAND, -1)[0], W(HAND, -1)[1] - 45]], [9.7, W(HAND, -1)], [10.3, W(HAND, -1)],
                [10.55, [W(HAND, -1)[0] - 10, W(HAND, -1)[1] - 22]], [11.35, W(PLACE, -1)], [11.85, W(PLACE, -1)], [12.6, [W(PLACE, -1)[0], W(PLACE, -1)[1] - 24]]];
function track(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) { const [ta, a] = keys[i - 1], [tb, b] = keys[i]; const s = ease((t - ta) / (tb - ta)); return [lerp(a[0], b[0], s), lerp(a[1], b[1], s)]; }
  }
  return keys[keys.length - 1][1];
}
const OPEN = 24, CLOSED = 7;
const T_RGRIP = 8.0, T_LGRIP = 9.95, T_ROPEN = 10.05, T_LREL = 11.55, T_FALL = .3;
function jawR(t) { return lerp(OPEN, CLOSED, seg(t, 7.75, T_RGRIP)) + (OPEN - CLOSED) * seg(t, T_ROPEN, T_ROPEN + .2); }
function jawL(t) { return lerp(OPEN, CLOSED, seg(t, 9.75, T_LGRIP)) + (34 - CLOSED) * seg(t, T_LREL - .05, T_LREL + .2); }
function markerAt(t) {
  if (t < T_RGRIP) return MK0;
  if (t < T_LGRIP) { const w = track(R_KEYS, t); return [w[0] - OFF, w[1] + GRIP]; }
  if (t < T_LREL) { const w = track(L_KEYS, t); return [w[0] + OFF, w[1] + GRIP]; }
  const w = track(L_KEYS, T_LREL), s = clamp((t - T_LREL) / T_FALL);
  return [w[0] + OFF, lerp(w[1] + GRIP, TY - 18, s * s)];
}

/* ---------- 블록 안 ---------- */
const N = 16, CX0 = 782, CX1 = 908, CY = 470;
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const noise = Array.from({ length: N }, () => (rnd() * 2 - 1) * 34);
const goal = Array.from({ length: N }, (_, i) => -26 * Math.sin((i / (N - 1)) * Math.PI * 1.1 - .25) + 6);
const dots = noise.map(() => el('circle', { r: 4.5, fill: '#94a3b8' }, $('chunk')));
const toks = Array.from({ length: 10 }, (_, i) => el('rect', { width: 10, height: 10, rx: 2.5, fill: i < 5 ? '#3b82f6' : '#8b5cf6', opacity: 0 }, $('tokens')));
const pulses = Array.from({ length: 6 }, () => el('circle', { r: 6, fill: '#ea580c', opacity: 0 }, $('pulses')));

/* ---------- 문구 ---------- */
const INS = ['“Put the blue', 'marker into the', 'white bin”'];
const INS_N = INS.reduce((a, s) => a + s.length, 0);
let WD = { V: 104, L: 163, A: 97 };
function measure() {
  WD = { V: $('fV').getComputedTextLength() + 6, L: $('fL').getComputedTextLength() + 6, A: $('fA').getComputedTextLength() + 6 };
  INS.forEach((s, i) => $('ins' + i).textContent = s);
  const w = Math.max(...INS.map((_, i) => $('ins' + i).getComputedTextLength()));
  $('chip').setAttribute('width', Math.ceil(w + 30));
}

/* ---------- 타임라인 ---------- */
function render(t) {
  // 1) 풀네임 + 글자색
  $('cVr').setAttribute('width', WD.V * seg(t, .3, .85, easeOut));
  $('cLr').setAttribute('width', WD.L * seg(t, .65, 1.2, easeOut));
  $('cAr').setAttribute('width', (WD.A + 4) * seg(t, 1.0, 1.45, easeOut));
  $('tV').setAttribute('fill', mix('#0f172a', '#2563eb', seg(t, .3, .75)));
  $('tL').setAttribute('fill', mix('#0f172a', '#7c3aed', seg(t, .65, 1.1)));
  const act = seg(t, 5.7, 6.05);
  $('tA').setAttribute('fill', mix('#0f172a', '#ea580c', act));
  $('fA').setAttribute('fill', mix('#cbd5e1', '#ea580c', act));

  // 2) 화살표 + 블록
  const dr = (id, len, a, b) => { const s = seg(t, a, b); $(id).setAttribute('stroke-dasharray', len); $(id).setAttribute('stroke-dashoffset', len * (1 - s)); return s; };
  $('arVh').setAttribute('opacity', dr('arV', 242, 1.25, 1.75) > .97 ? 1 : 0);
  $('arLh').setAttribute('opacity', dr('arL', 183, 1.35, 1.8) > .97 ? 1 : 0);
  $('arAh').setAttribute('opacity', dr('arA', 92, 5.8, 6.1) > .97 ? 1 : 0);
  const sb = seg(t, 1.6, 2.0, easeOut);
  $('block').setAttribute('opacity', sb);
  $('block').setAttribute('transform', `translate(845 420) scale(${lerp(.9, 1, sb)}) translate(-845 -420)`);

  // 3) 카메라 촬영 → Vision 썸네일, 지시문 타이핑
  const camOn = seg(t, 1.95, 2.15) * (1 - seg(t, 2.8, 3.2));
  $('cam').setAttribute('opacity', camOn); $('camBadge').setAttribute('opacity', camOn);
  $('flash').setAttribute('opacity', .75 * seg(t, 2.2, 2.25) * (1 - seg(t, 2.25, 2.6)));
  const vA = seg(t, 2.3, 2.65, easeOut), lA = seg(t, 2.1, 2.4, easeOut);
  const move = seg(t, 3.45, 4.35);
  $('visIn').setAttribute('opacity', vA * (1 - seg(t, 4.15, 4.35)));
  $('visIn').setAttribute('transform', `translate(${lerp(522, 790, move)} 375)`);
  $('visInner').setAttribute('transform', `scale(${lerp(1, .55, move) * lerp(.7, 1, vA)}) translate(0 -41.5)`);
  $('lanIn').setAttribute('opacity', lA * (1 - seg(t, 4.15, 4.35)));
  $('lanIn').setAttribute('transform', `translate(${lerp(583, 790, move)} 465)`);
  $('lanInner').setAttribute('transform', `scale(${lerp(1, .55, move) * lerp(.85, 1, lA)}) translate(0 -42)`);
  let n = Math.floor(clamp((t - 2.35) / .95) * INS_N), line = 0;
  INS.forEach((s, i) => { const k = clamp(n, 0, s.length); $('ins' + i).textContent = s.slice(0, k); if (n > 0 && k > 0) line = i; n -= s.length; });
  const typing = t > 2.35 && t < 3.45;
  $('caret').setAttribute('x', 14 + $('ins' + line).getComputedTextLength() + 3);
  $('caret').setAttribute('y', 8 + line * 23);
  $('caret').setAttribute('opacity', typing && (t < 3.3 || Math.floor(t * 5) % 2 === 0) ? 1 : 0);
  const fl = seg(t, 3.35, 3.5) * (1 - seg(t, 4.3, 4.55));
  for (const id of ['flowV', 'flowL']) { $(id).setAttribute('opacity', fl * .55); $(id).setAttribute('stroke-dashoffset', -t * 90); }

  // 4) 블록 처리: 토큰 → 노이즈 → action chunk
  const glow = seg(t, 4.2, 4.55) * (1 - .55 * seg(t, 6.2, 7.2));
  $('glow').setAttribute('opacity', .55 * glow * (1 + .15 * Math.sin(t * 6)));
  $('blockRing').setAttribute('opacity', glow);
  toks.forEach((r, i) => {
    const ti = 4.3 + i * .04, s = seg(t, ti, ti + .28, easeOut);
    r.setAttribute('x', 803 + (i % 5) * 18 - 5 - (1 - s) * 40);
    r.setAttribute('y', 452 + (i < 5 ? 0 : 18));
    r.setAttribute('opacity', s * (1 - seg(t, 4.95, 5.15)));
  });
  const den = seg(t, 5.05, 5.85), dotsOn = seg(t, 4.95, 5.12);
  let pts = '';
  dots.forEach((c, i) => {
    const x = lerp(CX0, CX1, i / (N - 1));
    const y = CY + lerp(noise[i], goal[i], den) + (1 - den) * 6 * Math.sin(t * 9 + i * 1.7);
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('opacity', dotsOn);
    c.setAttribute('fill', mix('#94a3b8', '#fb923c', den));
    pts += `${x.toFixed(1)},${y.toFixed(1)} `;
  });
  $('chunkLine').setAttribute('points', pts);
  $('chunkLine').setAttribute('opacity', seg(t, 5.5, 5.85) * .9);

  // 5) Action → 작업 공간
  pulses.forEach((p, i) => {
    const s = clamp((t - 6.0 - i * .08) / .5);
    p.setAttribute('cx', lerp(925, 1095, ease(s))); p.setAttribute('cy', 420);
    p.setAttribute('opacity', s > 0 && s < 1 ? Math.sin(s * Math.PI) : 0);
  });

  // 6) 로봇: 오른팔이 파란 마커 집기 → 건네기 → 왼팔이 흰색 칸에 넣기
  pose(RA, track(R_KEYS, t), jawR(t));
  pose(LA, track(L_KEYS, t), jawL(t));
  const m = markerAt(t);
  $('marker').setAttribute('transform', `translate(${m[0]} ${m[1]})`);
  // 물체가 지나간 길 (주황 점선)
  if (t > T_RGRIP) {
    let d = ''; const tEnd = Math.min(t, T_LREL + T_FALL);
    for (let u = T_RGRIP; u <= tEnd + 1e-6; u += .04) { const p = markerAt(u); d += (d ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }
    const p = markerAt(tEnd); d += 'L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
    $('trail').setAttribute('d', d);
    $('trail').setAttribute('opacity', .85 - .4 * seg(t, 12.3, 13.0));
  } else $('trail').setAttribute('opacity', 0);
}

/* ---------- 재생 ---------- */
const isRender = /render/.test(location.search);
let t0 = performance.now(), playing = true, tCur = 0;
function tick(now) {
  if (playing) { tCur = (now - t0) / 1000; if (tCur >= T_END) { tCur = T_END; playing = false; $('play').textContent = '재생'; } }
  render(tCur); $('scrub').value = tCur; $('tl').textContent = tCur.toFixed(2) + ' s';
  requestAnimationFrame(tick);
}
Promise.all(['500','600','700'].map(w => document.fonts.load(w + ' 20px "IBM Plex Sans KR"', '가A'))).then(() => document.fonts.ready).then(() => {
  measure();
  layoutMeta();
  if (isRender) {
    document.body.classList.add('render');
    const draw = () => { render(parseFloat(location.hash.slice(1)) || 0); document.title = 'ready'; };
    draw(); window.addEventListener('hashchange', draw);
    return;
  }
  $('play').onclick = () => { if (playing) { playing = false; $('play').textContent = '재생'; } else { if (tCur >= T_END) tCur = 0; t0 = performance.now() - tCur * 1000; playing = true; $('play').textContent = '일시정지'; } };
  $('replay').onclick = () => { tCur = 0; t0 = performance.now(); playing = true; $('play').textContent = '일시정지'; };
  $('scrub').oninput = e => { playing = false; $('play').textContent = '재생'; tCur = parseFloat(e.target.value); };
  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); $('play').click(); } });
  t0 = performance.now(); requestAnimationFrame(tick);
});
</script>
</body>
</html>
